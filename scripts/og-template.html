<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1200px; height:630px; overflow:hidden; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background:#05070a url("./og-art.jpg") center/cover no-repeat;
    color:#e8ecf1; position:relative;
  }
  /* darken left for legibility, let the art explode on the right */
  .scrim { position:absolute; inset:0; background:linear-gradient(90deg, rgba(5,7,10,.88) 0%, rgba(5,7,10,.72) 38%, rgba(5,7,10,0) 62%); }
  .content { position:absolute; left:72px; top:52px; width:620px; }
  .brand { display:flex; align-items:center; gap:12px; margin-bottom:26px; }
  .mark { width:42px; height:42px; border-radius:11px; background:#0a7d58; display:grid; place-items:center; box-shadow:0 8px 28px rgba(10,125,88,.55); }
  .mark svg { width:26px; height:26px; }
  .brand-name { font-size:22px; font-weight:800; letter-spacing:.14em; }
  .brand-name em { font-style:normal; color:#7dd3b0; }
  .kicker { display:inline-block; font-size:17px; font-weight:700; color:#7dd3b0; letter-spacing:.08em; padding:8px 14px; border:1px solid rgba(125,211,176,.4); border-radius:999px; background:rgba(10,125,88,.16); margin-bottom:22px; }
  h1 { font-size:70px; line-height:1.04; font-weight:900; letter-spacing:-.03em; }
  h1 .accent { color:#34d399; }
  .sub { margin-top:22px; font-size:24px; line-height:1.45; color:#b8c2cf; font-weight:500; }
  .pills { display:flex; flex-wrap:wrap; gap:9px; margin-top:30px; }
  .pill { font-size:16.5px; font-weight:700; color:#dbe4ee; padding:9px 15px; border-radius:999px; border:1px solid rgba(255,255,255,.18); background:rgba(255,255,255,.06); }
  .pill strong { color:#7dd3b0; font-weight:800; }
  .url { margin-top:26px; font-size:19px; font-weight:700; letter-spacing:.04em; color:#8b95a5; }
  .url b { color:#e8ecf1; }
</style>
</head>
<body>
  <div class="scrim"></div>
  <div class="content">
    <div class="brand">
      <span class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="5" height="5" x="3" y="3" rx="1"/><rect width="5" height="5" x="16" y="3" rx="1"/><rect width="5" height="5" x="3" y="16" rx="1"/><path d="M21 16h-3a2 2 0 0 0-2 2v3"/><path d="M21 21v.01"/><path d="M12 7v3a2 2 0 0 1-2 2H7"/><path d="M3 12h.01"/><path d="M12 3h.01"/><path d="M12 16v.01"/><path d="M16 12h1"/><path d="M21 12v.01"/><path d="M12 21v-1"/></svg></span>
      <span class="brand-name">QR <em>STUDIO</em></span>
    </div>
    <span class="kicker">무료 QR 코드 생성기 · 회원가입 없음</span>
    <h1>로고를 품은<br/>QR 코드,<br/><span class="accent">5초면 완성.</span></h1>
    <p class="sub">중앙에 내 로고를 넣고,<br/>PNG로 바로 저장하세요.</p>
    <div class="pills">
      <span class="pill"><strong>URL</strong></span><span class="pill">Wi-Fi</span><span class="pill">텍스트</span><span class="pill">전화</span><span class="pill">SMS</span><span class="pill">이메일</span><span class="pill">PNG 다운로드</span>
    </div>
    <p class="url"><b>qr.homin.dev</b></p>
  </div>
</body>
</html>
